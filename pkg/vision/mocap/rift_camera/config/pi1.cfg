# Rift CV1 cameras on Pi 1: one rift_camera process per line.
#
# serial          eth0 alias     row_start
#
# row_start is the first of the 576 sensor rows read out (0 to 384; 192 is
# the centre). Each alias must be on eth0 (169.254.10.1-4 on Pi 1).
WMTD305350189Q    169.254.10.1   192
WMTD3062200XGN    169.254.10.2   192
WMTD3079700ZW1    169.254.10.3   192
WMTD307A200J7A    169.254.10.4   192
